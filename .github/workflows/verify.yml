name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare hash-pinned source verification tools
        run: |
          python3 -m pip download --only-binary=:all: --require-hashes -r packaging/build-requirements.txt --dest work/build-wheels
          python3 -m pip install --no-index --find-links work/build-wheels --require-hashes -r packaging/build-requirements.txt
      - name: Check source and strict dependency evidence
        run: |
          python3 -m compileall -q src fixtures tests scripts
          python3 -W error::ResourceWarning -m unittest tests.test_sqlcipher_supply_chain tests.test_verify tests.test_application_test_results tests.test_release_package tests.test_audit_validation tests.test_storage_key_custody tests.test_approval.ApprovalContractTest tests.test_json_depth tests.test_peer.PeerCredentialTest tests.test_windows_boundary.WindowsPathTest tests.test_windows_pipe.PipeInputTest -v
          python3 -c 'from scripts.verify import schema_check, whitespace_check, sqlcipher_supply_chain_check; schema_check(); whitespace_check(); sqlcipher_supply_chain_check()'
          git diff --check
