name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Check source and strict dependency evidence
        run: |
          python3 -m compileall -q src fixtures tests scripts
          python3 -m unittest tests.test_sqlcipher_supply_chain tests.test_verify -v
          python3 -c 'from scripts.verify import schema_check, whitespace_check, sqlcipher_supply_chain_check; schema_check(); whitespace_check(); sqlcipher_supply_chain_check()'
          git diff --check
