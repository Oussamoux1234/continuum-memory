name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-python39:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9"
      - name: Acquire hash-pinned SQLCipher wheel
        run: >-
          python3 -m pip download --require-hashes --only-binary=:all: --no-deps
          --dest work/dependencies -r requirements/sqlcipher-python39.txt
      - name: Install SQLCipher runtime from the pinned wheel
        run: >-
          python3 -m pip install --no-index --no-deps --find-links work/dependencies
          sqlcipher3==0.6.2
      - name: Verify prototype
        run: python3 scripts/verify.py
