name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spdx-validation:
    name: spdx-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Acquire hash-pinned SPDX validator
        run: >-
          python3 -m pip download --require-hashes --only-binary=:all: --no-deps
          --dest work/spdx-validation -r requirements/spdx-validation-linux-py314.txt
      - name: Install hash-pinned SPDX validator
        run: >-
          python3 -m pip install --require-hashes --no-index --no-deps
          --find-links work/spdx-validation -r requirements/spdx-validation-linux-py314.txt
      - name: Validate installed tool dependencies
        run: python3 -m pip check
      - name: Validate SPDX 2.3 inventory
        run: pyspdxtools --infile sbom/continuum-memory.spdx.json --version SPDX-2.3

  linux-maintained-python:
    name: linux-python${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Acquire hash-pinned SQLCipher wheel
        run: >-
          python3 -m pip download --require-hashes --only-binary=:all: --no-deps
          --dest work/dependencies -r requirements/sqlcipher-maintained.txt
      - name: Acquire hash-pinned verification build tool
        run: >-
          python3 -m pip download --require-hashes --only-binary=:all: --no-deps
          --dest work/build-dependencies -r requirements/verification-tools.txt
      - name: Install pinned verification build tool
        run: >-
          python3 -m pip install --no-index --no-deps --find-links work/build-dependencies
          setuptools==80.9.0
      - name: Install pinned SQLCipher runtime
        run: >-
          python3 -m pip install --no-index --no-deps --find-links work/dependencies
          sqlcipher3==0.6.2
      - name: Verify prototype
        run: python3 scripts/verify.py
